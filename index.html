function fmt(n){return '₹'+Number(n||0).toLocaleString('en-IN');}

function computeStatus(amount,paid){return paid>=amount?'Completed':'Pending';}

function renderStats(list){
  const total=list.length;
  const completed=list.filter(p=>p.status==='Completed').length;
  const pending=total-completed;
  const revenue=list.reduce((s,p)=>s+Number(p.paid||0),0);
  const pendingAmt=list.reduce((s,p)=>s+Math.max(Number(p.amount||0)-Number(p.paid||0),0),0);
  document.getElementById('statTotal').textContent=total;
  document.getElementById('statCompleted').textContent=completed;
  document.getElementById('statPending').textContent=pending;
  document.getElementById('statRevenue').textContent=fmt(revenue);
  document.getElementById('statPendingAmt').textContent=fmt(pendingAmt);
}

function renderTable(){
  const q=document.getElementById('searchInput').value.trim().toLowerCase();
  const st=document.getElementById('filterStatus').value;
  const cat=document.getElementById('filterCategory').value;
  const filtered=projects.filter(p=>{
    const matchQ=!q||p.client.toLowerCase().includes(q)||p.project.toLowerCase().includes(q);
    const matchSt=!st||p.status===st;
    const matchCat=!cat||p.category===cat;
    return matchQ&&matchSt&&matchCat;
  });
  const tbody=document.getElementById('tableBody');
  tbody.innerHTML='';
  if(filtered.length===0){
    tbody.innerHTML='<tr class="empty-row"><td colspan="10">No projects match your search.</td></tr>';
  }else{
    filtered.forEach(p=>{
      const balance=Math.max(Number(p.amount)-Number(p.paid),0);
      const tr=document.createElement('tr');
      tr.innerHTML=`
        <td>${escapeHtml(p.client)}</td>
        <td>${escapeHtml(p.project)}</td>
        <td>${escapeHtml(p.category||'—')}</td>
        <td>${p.date?formatDate(p.date):'—'}</td>
        <td>${fmt(p.amount)}</td>
        <td>${fmt(p.paid)}</td>
        <td>${fmt(balance)}</td>
        <td><span class="badge ${p.status==='Completed'?'completed':'pending'}">${p.status}</span></td>
        <td style="max-width:180px;color:var(--muted);">${escapeHtml(p.notes||'—')}</td>
        <td><div class="row-actions">
          <button class="edit" data-id="${p.id}" title="Edit">✎</button>
          <button class="del" data-id="${p.id}" title="Delete">✕</button>
        </div></td>`;
      tbody.appendChild(tr);
    });
  }
  renderStats(projects);
}
function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function formatDate(d){const dt=new Date(d);return isNaN(dt)?d:dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});}

      }
      await loadWorks();
      showToast(id?'Work updated — live for everyone':'Work added — live for everyone');
    }catch(err){
      console.error(err);
      showToast('Save failed — check Supabase setup');
      return;
    }
  }else{
    if(id){
      const idx=works.findIndex(w=>w.id==id);
      if(idx>-1)works[idx]={...works[idx],title:data.title,cat:data.cat,year:data.year,desc:data.desc,color:[data.color1,data.color2]};
      showToast('Work updated (this browser only)');
    }else{
      works.unshift({id:Date.now(),title:data.title,cat:data.cat,year:data.year,desc:data.desc,color:[data.color1,data.color2]});
      showToast('Work added (this browser only)');
    }
    saveWorksLocal();
  }
  closeWorkModal();
  renderWorksTable();
  renderWorks(document.querySelector('.chip.active')?.dataset.filter||'all');
});

document.getElementById('worksTableBody').addEventListener('click',async e=>{
  const editBtn=e.target.closest('.edit');
  const delBtn=e.target.closest('.del');
  if(editBtn){
    const w=works.find(wk=>wk.id==editBtn.dataset.id);
    if(w)openWorkEditModal(w);
  }
  if(delBtn){
    if(!confirm('Delete this work?'))return;
    const id=delBtn.dataset.id;
    if(supabaseReady){
      try{
        const {error}=await sb.from('works').delete().eq('id',id);
        if(error)throw error;
        await loadWorks();
      }catch(err){
        console.error(err);
        showToast('Delete failed — check Supabase setup');
        return;
      }
    }else{
      works=works.filter(w=>w.id!=id);
      saveWorksLocal();
    }
    renderWorksTable();
    renderWorks(document.querySelector('.chip.active')?.dataset.filter||'all');
    showToast('Work deleted');
  }
});
</script>
</body>
</html>
